name: Deploy to PlanetHoster

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2

      - name: Installer les dépendances
        run: bun install

      - name: Compiler le projet
        run: bun run build

      - name: Shim Passenger (app.js)
        run: printf 'import("./server/index.mjs");\n' > .output/app.js

      - name: Migrations base de données
        if: hashFiles('drizzle.config.ts') != ''
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATION }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/db_tunnel && chmod 600 ~/.ssh/db_tunnel
          ssh -i ~/.ssh/db_tunnel -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o ExitOnForwardFailure=yes \
            -fN -L 5433:localhost:5432 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          bunx drizzle-kit migrate

      - name: Transfert du build sur PlanetHoster
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          ARGS: "-rltgoDzv0 --delete"
          SOURCE: ".output/"
          EXCLUDE: "/tmp/, /node_modules/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          TARGET: ${{ secrets.SSH_TARGET_DIR }}
          SCRIPT_AFTER: |
            mkdir -p ${{ secrets.SSH_TARGET_DIR }}/tmp
            touch ${{ secrets.SSH_TARGET_DIR }}/tmp/restart.txt
